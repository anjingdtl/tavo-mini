apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// react-native-keychain 10.0.0 and react-native-svg both fork `node --print`
// from this subproject's rootDir to resolve the react-native package. On
// Windows that process often returns an empty string ("Cannot convert '' to
// File") or exits with a non-zero code. Setting REACT_NATIVE_NODE_MODULES_DIR
// here short-circuits the fork in both libraries.
rootProject.ext.REACT_NATIVE_NODE_MODULES_DIR = file("../../node_modules/react-native").absolutePath
project.ext.REACT_NATIVE_NODE_MODULES_DIR = file("../../node_modules/react-native").absolutePath

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   Force JS bundle embedding for ALL variants. RN 0.85 defaults debuggableVariants
    //   to ["debug", "debugOptimized"] which skip bundling → PlatformConstants error.
    debuggableVariants = []

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Release minification is opt-in until the signed APK has passed the complete
 * real-device matrix (online/local LLM, TTS, backup and restore). The opt-in
 * flag keeps the evaluation reproducible without silently shipping a package
 * whose native reflection paths have not been exercised.
 */
def enableReleaseMinification = project.findProperty("enableReleaseMinification")?.toString()?.toBoolean() ?: false

def releaseBuildRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains("release")
}

def releaseSigningValues = [
    "SHINE_WRITER_RELEASE_STORE_FILE",
    "SHINE_WRITER_RELEASE_STORE_PASSWORD",
    "SHINE_WRITER_RELEASE_KEY_ALIAS",
    "SHINE_WRITER_RELEASE_KEY_PASSWORD",
].collectEntries { name -> [name, System.getenv(name)] }

if (releaseBuildRequested) {
    def missingReleaseSigningValues = releaseSigningValues.findAll { name, value ->
        value == null || value.trim().isEmpty()
    }.keySet()
    if (!missingReleaseSigningValues.isEmpty()) {
        throw new GradleException(
            "Release signing requires environment variable(s): ${missingReleaseSigningValues.join(', ')}. " +
            "Debug builds do not require release signing secrets."
        )
    }
    def releaseStoreFile = file(releaseSigningValues["SHINE_WRITER_RELEASE_STORE_FILE"])
    if (!releaseStoreFile.exists()) {
        throw new GradleException(
            "Release signing keystore not found: ${releaseStoreFile.absolutePath}"
        )
    }
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.shinewriter"

    defaultConfig {
        applicationId "com.shinewriter"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                // 修复 WIN-MAX_PATH：Android SDK 自带 cmake 3.22.1 集成的 ninja 版本太旧（1.10+），
                // 在编译 react-native 新架构 codegen（C++ 源路径很长）时触发
                //   ninja: error: Stat(...): Filename longer than 260 characters
                // 因为老 ninja 走的是 MAX_PATH 限制的 Win32 API。指向用户本地的 1.13+ ninja 即可。
                // 候选路径：Tauri 工具链 / 用户 .local/bin
                def userNinja = [
                    "C:/Users/${System.getProperty('user.name')}/.local/bin/ninja.exe",
                ].find { f -> file(f).exists() }
                if (userNinja) {
                    arguments "-DCMAKE_MAKE_PROGRAM=${userNinja.replace('\\', '/')}"
                }
            }
        }

        // version.json is generated from package.json before npm APK builds.
        // Gradle consumes that generated artifact so local and CI builds use
        // one exact versionName/versionCode pair without Git-history input.
        def versionMeta = new groovy.json.JsonSlurper().parse(file("../../src/constants/version.json"))

        versionCode versionMeta.versionCode as int
        versionName versionMeta.versionName as String
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseBuildRequested) {
                storeFile file(releaseSigningValues["SHINE_WRITER_RELEASE_STORE_FILE"])
                storePassword releaseSigningValues["SHINE_WRITER_RELEASE_STORE_PASSWORD"]
                keyAlias releaseSigningValues["SHINE_WRITER_RELEASE_KEY_ALIAS"]
                keyPassword releaseSigningValues["SHINE_WRITER_RELEASE_KEY_PASSWORD"]
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            signingConfig signingConfigs.release
            // The JS network policy is identical in debug/release and rejects
            // public HTTP. The manifest must still permit the explicit,
            // private-LAN HTTP opt-in to work in a signed APK.
            manifestPlaceholders = [usesCleartextTraffic: "true"]
            minifyEnabled enableReleaseMinification
            shrinkResources enableReleaseMinification
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake {
            path "jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // AGP 9.x 严格化检查：AndroidManifest 显式声明 `android:extractNativeLibs="true"`
    // 时，必须同步声明 packagingOptions.jniLibs.useLegacyPackaging = true，
    // 否则 :app:packageDebug 直接失败。保留 extractNativeLibs=true 是为了避免
    // 安装时把 .so 从 APK 抽出到 /data 造成 IO 与首启延迟（TurboModule + llama.cpp
    // JNI 路径相对较长），native libs 随 APK 直接映射更省。
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Coroutines (kept for potential future use)
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// `npm run apk:debug` (and apk:release) run `node scripts/generate-version-json.js`
// via the `prebuild` script in package.json BEFORE invoking gradle, so the
// `version.json` file is already up-to-date on disk. Running it again as a
// Gradle Exec task on Windows hits "Process 'command 'node'' finished with
// non-zero exit value 268435659" (a STATUS-class error from the daemon
// forking node through a long pipe chain). The task is left here for
// reference but its preBuild hook is intentionally not wired.
task generateVersionJson(type: Exec) {
    workingDir "../../"
    commandLine "node", "scripts/generate-version-json.js"
}

// React Native's bundle task does not reliably track imported JSON files.
// Declare the generated version file explicitly so version-only releases
// cannot reuse a stale JS bundle.
tasks.matching { task ->
    task.name.startsWith("createBundle") && task.name.endsWith("JsAndAssets")
}.configureEach {
    inputs.file(file("../../src/constants/version.json"))
}
