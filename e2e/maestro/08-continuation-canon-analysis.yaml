appId: com.shinewriter
---
# Current Canon analysis entry: continuation resources show import-or-analysis.
- launchApp
- runFlow:
    when:
      visible: '我知道了'
    commands:
      - tapOn: '我知道了'
- extendedWaitUntil:
    visible:
      id: project-library
    timeout: 20000
- tapOn:
    id: tab-projects
- tapOn:
    id: project-mode-continuation
- tapOn:
    id: new-project-button
- tapOn:
    id: new-project-name
- inputText: 'E2E_CANON'
- tapOn: '原著续写'
- tapOn:
    id: create-project-button
- tapOn:
    id: tab-resources
- tapOn:
    id: resource-tab-continuation
- extendedWaitUntil:
    visible: '导入 TXT 原著'
    timeout: 10000
- runFlow:
    when:
      visible:
        id: continuation-open-analysis
    commands:
      - tapOn:
          id: continuation-open-analysis
      - assertVisible: '原著分析'
- runFlow:
    when:
      visible:
        id: continuation-import-txt
    commands:
      - tapOn:
          id: continuation-import-txt
      - assertVisible: '导入 TXT 原著'
