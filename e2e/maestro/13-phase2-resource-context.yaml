appId: com.shinewriter
---
# Phase-2: Character / Worldbook / Preset enter writing runtime via
# Global Awareness + Context Preview. Overlay-install safe (no clearState).
- launchApp
- runFlow:
    when:
      visible: '关闭'
    commands:
      - tapOn: '关闭'
- extendedWaitUntil:
    visible: '作品库'
    timeout: 20000
- tapOn: '新建'
- tapOn:
    id: new-project-name
- inputText: 'P2_AWARENESS'
- tapOn: '创建'
- extendedWaitUntil:
    visible: 'P2_AWARENESS'
    timeout: 10000
- tapOn: '2 资料'
- extendedWaitUntil:
    visible: '角色'
    timeout: 10000
- tapOn: '角色'
- extendedWaitUntil:
    visible: '新建角色合集'
    timeout: 10000
- tapOn: '新建角色合集'
- tapOn:
    id: resource-editor-name
- inputText: 'P2_CHARS'
- tapOn: '保存'
- extendedWaitUntil:
    visible: 'P2_CHARS'
    timeout: 10000
- tapOn: '打开'
- tapOn: '新建角色卡'
- extendedWaitUntil:
    visible: '编辑角色卡'
    timeout: 10000
- tapOn: '保存'
- tapOn: '世界书'
- extendedWaitUntil:
    visible: '新建世界书'
    timeout: 10000
- tapOn: '新建世界书'
- tapOn:
    id: resource-editor-name
- inputText: 'P2_WORLD'
- tapOn: '保存'
- tapOn: '打开'
- tapOn: '新建条目'
- tapOn:
    id: resource-editor-name
- inputText: '青秀路'
- tapOn:
    id: resource-editor-content
- inputText: '青秀路存在雨夜杀人狂。居民避免雨夜独行。'
- tapOn: '保存'
- tapOn: '预设'
- extendedWaitUntil:
    visible: '预设'
    timeout: 10000
- tapOn: '3 写作'
- extendedWaitUntil:
    visible: '章节'
    timeout: 10000
- tapOn: '章节'
- extendedWaitUntil:
    visible: '章节编辑'
    timeout: 10000
- tapOn:
    id: chapter-title-input
- eraseText: 30
- inputText: '撑伞走过青秀路'
- swipe:
    from:
      id: chapter-toolbar-scroll
    direction: LEFT
- swipe:
    from:
      id: chapter-toolbar-scroll
    direction: LEFT
- tapOn:
    id: chapter-context-button
    retryTapIfNoChange: true
- tapOn:
    id: chapter-context-button
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '上下文预览'
    timeout: 20000
- assertVisible: '上下文预算 V3 分层弹性'
- assertVisible: '.*Resource Context V2.*'
- tapOn: '关闭'
