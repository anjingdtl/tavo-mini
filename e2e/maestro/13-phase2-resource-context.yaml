appId: com.shinewriter
---
# Phase-2 resources plus Writer Style tab enter Context Preview.
- launchApp
- runFlow:
    when:
      visible: '我知道了'
    commands:
      - tapOn: '我知道了'
- extendedWaitUntil:
    visible:
      id: project-library
    timeout: 20000
- tapOn:
    id: tab-projects
- tapOn:
    id: project-mode-outline
- tapOn:
    id: new-project-button
- tapOn:
    id: new-project-name
- inputText: 'P2_AWARENESS'
- tapOn:
    id: create-project-button
- tapOn:
    id: tab-resources
- tapOn:
    id: resource-tab-characters
- tapOn: '新建角色合集'
- tapOn:
    id: resource-editor-name
- inputText: 'P2_CHARS'
- tapOn: '保存'
- tapOn: '打开'
- tapOn: '新建角色卡'
- tapOn: '保存'
- tapOn:
    id: resource-tab-worldbook
- tapOn: '新建世界书'
- tapOn:
    id: resource-editor-name
- inputText: 'P2_WORLD'
- tapOn: '保存'
- tapOn: '打开'
- tapOn: '新建条目'
- tapOn:
    id: resource-editor-name
- inputText: '青秀路'
- tapOn:
    id: resource-editor-content
- inputText: '青秀路存在雨夜杀人狂。居民避免雨夜独行。'
- tapOn: '保存'
- tapOn:
    id: resource-tab-writer-style
- extendedWaitUntil:
    visible: '作家风格'
    timeout: 10000
- assertVisible: '导入作家风格'
- tapOn:
    id: writer-style-add-name
- inputText: 'P2_STYLE'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: '添加'
- scrollUntilVisible:
    element: '设为当前作家风格'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 40
    speed: 70
- tapOn: '设为当前作家风格'
- extendedWaitUntil:
    visible: '当前项目正在使用'
    timeout: 10000
- tapOn:
    id: tab-editor
- tapOn:
    id: writing-add-chapter
- tapOn:
    id: chapter-title-input
- eraseText: 30
- inputText: '撑伞走过青秀路'
- swipe:
    from:
      id: chapter-toolbar-scroll
    direction: LEFT
- swipe:
    from:
      id: chapter-toolbar-scroll
    direction: LEFT
- tapOn:
    id: chapter-context-button
    retryTapIfNoChange: true
- tapOn:
    id: chapter-context-button
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '上下文预览'
    timeout: 20000
- scrollUntilVisible:
    element: '上下文预算 V3 分层弹性'
    direction: DOWN
    timeout: 25000
    visibilityPercentage: 40
- scrollUntilVisible:
    element: '.*Resource Context V2.*'
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 40
- tapOn:
    id: context-preview-close
