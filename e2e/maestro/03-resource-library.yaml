appId: com.shinewriter
---
# Current ResourceLibrary: segmented tabs, no ResourceHome hop.
- launchApp
- runFlow:
    when:
      visible: '我知道了'
    commands:
      - tapOn: '我知道了'
- extendedWaitUntil:
    visible:
      id: project-library
    timeout: 20000
- tapOn:
    id: tab-projects
- tapOn:
    id: project-mode-outline
- tapOn:
    id: new-project-button
- tapOn:
    id: new-project-name
- inputText: 'E2E_RESOURCES'
- tapOn:
    id: create-project-button
- tapOn:
    id: tab-resources
- extendedWaitUntil:
    visible:
      id: resource-library
    timeout: 10000
- tapOn:
    id: resource-tab-characters
- extendedWaitUntil:
    visible: '新建角色合集'
    timeout: 10000
- tapOn: '新建角色合集'
- extendedWaitUntil:
    visible: '编辑角色合集'
    timeout: 10000
- tapOn:
    id: resource-editor-name
- inputText: 'E2E_CHARACTERS'
- tapOn: '保存'
- extendedWaitUntil:
    visible: 'E2E_CHARACTERS'
    timeout: 10000
- tapOn: '打开'
- extendedWaitUntil:
    visible: '新建角色卡'
    timeout: 10000
- tapOn: '新建角色卡'
- extendedWaitUntil:
    visible: '编辑角色卡'
    timeout: 10000
- tapOn: '保存'
- tapOn:
    id: resource-tab-worldbook
- extendedWaitUntil:
    visible: '新建世界书'
    timeout: 10000
- tapOn: '新建世界书'
- extendedWaitUntil:
    visible: '编辑世界书合集'
    timeout: 10000
- tapOn:
    id: resource-editor-name
- inputText: 'E2E_WORLDBOOK'
- tapOn: '保存'
- extendedWaitUntil:
    visible: 'E2E_WORLDBOOK'
    timeout: 10000
- tapOn: '打开'
- extendedWaitUntil:
    visible: '新建条目'
    timeout: 10000
- tapOn: '新建条目'
- extendedWaitUntil:
    visible: '编辑世界书条目'
    timeout: 10000
- tapOn:
    id: resource-editor-name
- inputText: 'E2E_KEYWORD'
- swipe:
    direction: UP
- swipe:
    direction: UP
- runFlow:
    when:
      visible:
        id: resource-editor-content
    commands:
      - tapOn:
          id: resource-editor-content
- runFlow:
    when:
      visible: '内容'
    commands:
      - tapOn: '内容'
- inputText: 'E2E_WORLD_CONTENT'
- tapOn: '保存'
- extendedWaitUntil:
    visible: 'E2E_KEYWORD'
    timeout: 10000
- tapOn:
    id: resource-tab-writer-style
- assertVisible: '作家风格'
- assertVisible: '导入作家风格'
