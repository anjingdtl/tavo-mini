appId: com.shinewriter
---
# Current finalize / state-rebuild entry is the chapter 定稿 control.
- launchApp
- runFlow:
    when:
      visible: '我知道了'
    commands:
      - tapOn: '我知道了'
- extendedWaitUntil:
    visible:
      id: project-library
    timeout: 20000
- tapOn:
    id: tab-projects
- tapOn:
    id: project-mode-continuation
- tapOn:
    id: new-project-button
- tapOn:
    id: new-project-name
- inputText: 'E2E_CONT_FINAL'
- tapOn: '原著续写'
- tapOn:
    id: create-project-button
- tapOn:
    id: tab-editor
- tapOn:
    id: continuation-add-chapter
- extendedWaitUntil:
    visible:
      id: chapter-finalize
    timeout: 10000
- assertVisible: '定稿'
- tapOn:
    id: chapter-back
- assertVisible: '续写章节'
