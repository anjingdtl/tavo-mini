appId: com.shinewriter
---
# Current continuation writing workspace. Generation still requires source + LLM.
- launchApp
- runFlow:
    when:
      visible: '我知道了'
    commands:
      - tapOn: '我知道了'
- extendedWaitUntil:
    visible:
      id: project-library
    timeout: 20000
- tapOn:
    id: tab-projects
- tapOn:
    id: project-mode-continuation
- tapOn:
    id: new-project-button
- tapOn:
    id: new-project-name
- inputText: 'E2E_CONT_WRITE'
- tapOn: '原著续写'
- tapOn:
    id: create-project-button
- tapOn:
    id: tab-editor
- extendedWaitUntil:
    visible: '原著续写工作台'
    timeout: 10000
- assertVisible: 'Canon 驱动续写'
- tapOn:
    id: continuation-add-chapter
- extendedWaitUntil:
    visible:
      id: chapter-editor
    timeout: 10000
- assertVisible:
    id: chapter-ai-generate
- tapOn:
    id: chapter-back
- assertVisible: '续写章节'
