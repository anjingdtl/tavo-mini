appId: com.shinewriter
---
# Create an outline project, add a chapter, edit body, leave, and reopen.
- launchApp
- runFlow:
    when:
      visible: '我知道了'
    commands:
      - tapOn: '我知道了'
- extendedWaitUntil:
    visible:
      id: project-library
    timeout: 20000
- tapOn:
    id: tab-projects
- tapOn:
    id: project-mode-outline
- tapOn:
    id: new-project-button
- tapOn:
    id: new-project-name
- inputText: 'E2E_WRITING_FLOW'
- tapOn:
    id: create-project-button
- extendedWaitUntil:
    visible: 'E2E_WRITING_FLOW'
    timeout: 10000
- tapOn:
    id: tab-editor
- tapOn:
    id: writing-add-chapter
- extendedWaitUntil:
    visible:
      id: chapter-editor
    timeout: 10000
- assertVisible: '章节编辑'
- tapOn:
    id: chapter-title-input
- eraseText: 30
- inputText: 'E2E_CHAPTER'
- tapOn:
    id: chapter-content-input
- inputText: 'E2E_BODY_CONTENT'
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible:
        id: chapter-back
    commands:
      - tapOn:
          id: chapter-back
- runFlow:
    when:
      visible: '返回'
    commands:
      - tapOn: '返回'
- extendedWaitUntil:
    visible:
      id: writing-home
    timeout: 10000
- scrollUntilVisible:
    element:
      text: 'E2E_CHAPTER'
    direction: DOWN
    timeout: 10000
- tapOn: 'E2E_CHAPTER'
- extendedWaitUntil:
    visible: 'E2E_BODY_CONTENT'
    timeout: 10000
