appId: com.shinewriter
---
# Open the current LLM settings surface. Do not overwrite the user's live
# Keystore config or set a dummy model as current.
- launchApp
- runFlow:
    when:
      visible: '我知道了'
    commands:
      - tapOn: '我知道了'
- extendedWaitUntil:
    visible:
      id: project-library
    timeout: 20000
- tapOn:
    id: tab-settings
- tapOn:
    id: settings-llm
- extendedWaitUntil:
    visible:
      id: llm-settings
    timeout: 10000
- assertVisible:
    id: llm-config-name
- assertVisible:
    id: llm-context-window
- assertVisible:
    id: llm-max-output-tokens
- swipe:
    direction: UP
- assertVisible:
    id: llm-save
- tapOn:
    id: tab-projects
- assertVisible:
    id: project-library
