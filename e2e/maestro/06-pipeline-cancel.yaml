appId: com.shinewriter
---
# Reach the pipeline start/cancel controls without starting a live LLM job.
- launchApp
- runFlow:
    when:
      visible: '我知道了'
    commands:
      - tapOn: '我知道了'
- extendedWaitUntil:
    visible:
      id: project-library
    timeout: 20000
- tapOn:
    id: tab-projects
- tapOn:
    id: project-mode-outline
- tapOn:
    id: new-project-button
- tapOn:
    id: new-project-name
- inputText: 'E2E_PIPELINE'
- tapOn:
    id: create-project-button
- tapOn:
    id: tab-editor
- tapOn:
    id: writing-add-chapter
- tapOn:
    id: chapter-title-input
- eraseText: 30
- inputText: 'E2E_PIPELINE_CHAPTER'
- tapOn:
    id: chapter-content-input
- inputText: 'E2E_PIPELINE_BODY'
- scrollUntilVisible:
    element:
      id: chapter-ai-generate
    direction: DOWN
    timeout: 10000
- tapOn:
    id: chapter-ai-generate
- runFlow:
    when:
      visible: '覆盖并生成'
    commands:
      - tapOn: '取消'
- tapOn:
    id: tab-settings
- tapOn:
    id: settings-pipeline-tasks
- extendedWaitUntil:
    visible:
      id: pipeline-task-list
    timeout: 15000
- assertVisible: '流水线任务'
