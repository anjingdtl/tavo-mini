# E2E (lightweight): continuation style overview navigation (WP5 Spec §10.1)
# Preconditions: continuation project preferred; CI may only assert navigation
# labels without a full style analysis fixture.
appId: com.shinewriter
---
- launchApp
- assertVisible: "项目"
- tapOn: "资料"
- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 5000
# Manual / device-with-fixture checkpoint:
# 1) Open 续写 → 原著分析（分析概览）
# 2) Assert card title 「原著写作风格」 and one of:
#    未分析 / 分析中 / 失败 / 就绪 / 过期 / 已忽略
# 3) If 就绪: tap 查看详情 → StyleProfileDetail shows 概览 / 用户修正
# 4) Return → 单独重试 / 忽略 / 恢复 / 跳过风格并激活 as available
# 5) Settings → 续写生成配置 → assert 「文风约束」 关闭/平衡/严格
- takeScreenshot: continuation-style-overview
