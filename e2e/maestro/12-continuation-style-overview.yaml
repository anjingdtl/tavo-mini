appId: com.shinewriter
---
# Current style overview: continuation resources plus generation config 文风.
- launchApp
- runFlow:
    when:
      visible: '我知道了'
    commands:
      - tapOn: '我知道了'
- extendedWaitUntil:
    visible:
      id: project-library
    timeout: 20000
- tapOn:
    id: tab-projects
- tapOn:
    id: project-mode-continuation
- tapOn:
    id: new-project-button
- tapOn:
    id: new-project-name
- inputText: 'E2E_CONT_STYLE'
- tapOn: '原著续写'
- tapOn:
    id: create-project-button
- tapOn:
    id: tab-resources
- tapOn:
    id: resource-tab-continuation
- assertVisible: '导入 TXT 原著'
- tapOn:
    id: tab-settings
- tapOn:
    id: settings-pipeline-config
- extendedWaitUntil:
    visible:
      id: continuation-generation-config
    timeout: 10000
- assertVisible: '校验严格度方案'
- scrollUntilVisible:
    element: '原著文风'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 40
- assertVisible: '始终严格遵循原著画风画像；未完成或未启用画像时，续写将被阻断。'
