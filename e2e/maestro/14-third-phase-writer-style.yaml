appId: com.shinewriter
---
# Writer Style library + structured Semantic editor. Overlay-install safe.
- launchApp
- runFlow:
    when:
      visible: '我知道了'
    commands:
      - tapOn: '我知道了'
- extendedWaitUntil:
    visible:
      id: project-library
    timeout: 20000
- tapOn:
    id: tab-projects
- tapOn:
    id: project-mode-outline
- tapOn:
    id: new-project-button
- tapOn:
    id: new-project-name
- inputText: 'E2E_WRITER_STYLE'
- tapOn:
    id: create-project-button
- tapOn:
    id: tab-resources
- tapOn:
    id: resource-tab-writer-style
- extendedWaitUntil:
    visible:
      id: writer-style-catalog-list
    timeout: 10000
- assertVisible: '作家风格'
- assertVisible: '来源：内置'
- assertVisible: '长篇连贯叙事'
- assertNotVisible: '我的作家风格'
- assertNotVisible: '导入预设'
- tapOn:
    id: '^writer-style-catalog-add-official-literary-continuity-v1$'
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element: '编辑'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
    speed: 70
- tapOn: '编辑'
- extendedWaitUntil:
    visible:
      id: writer-style-editor
    timeout: 10000
- assertVisible: '基本定位'
- scrollUntilVisible:
    element:
      id: writer-style-group-narration
    direction: DOWN
    visibilityPercentage: 40
- scrollUntilVisible:
    element:
      id: writer-style-field-texture
    direction: DOWN
    visibilityPercentage: 40
- tapOn:
    id: writer-style-field-texture
- inputText: 'E2E_TEXTURE'
- scrollUntilVisible:
    element:
      id: writer-style-group-prohibitions
    direction: DOWN
    visibilityPercentage: 40
- scrollUntilVisible:
    element:
      id: writer-style-advanced-toggle
    direction: DOWN
    visibilityPercentage: 40
- tapOn:
    id: writer-style-advanced-toggle
- assertVisible: '运行时编译结果由 WriterStyleSemanticV1 确定性生成，不能反向当作主编辑模型。'
- tapOn:
    id: writer-style-save
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: '设为当前作家风格'
    commands:
      - tapOn: '设为当前作家风格'
- extendedWaitUntil:
    visible: '当前项目正在使用'
    timeout: 10000
