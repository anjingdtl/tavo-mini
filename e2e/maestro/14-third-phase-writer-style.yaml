appId: com.shinewriter
---
# Third-phase read-only smoke flow. It intentionally preserves the existing
# device database and validates the unified Writer Style information architecture.
- launchApp
- runFlow:
    when:
      visible: '我知道了'
    commands:
      - tapOn: '我知道了'
- extendedWaitUntil:
    visible: '作品库'
    timeout: 15000
- tapOn: '2 资料'
- extendedWaitUntil:
    visible: '作家风格'
    timeout: 10000
- tapOn: '作家风格'
- extendedWaitUntil:
    visible: '我的作家风格'
    timeout: 10000
- assertVisible: '来源模板'
- takeScreenshot: third-phase-writer-style
