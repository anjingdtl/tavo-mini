appId: com.shinewriter
---
# Current continuation import entry: create a continuation project and assert
# the TXT import CTA. File picker remains a device-only step and is not faked.
- launchApp
- runFlow:
    when:
      visible: '我知道了'
    commands:
      - tapOn: '我知道了'
- extendedWaitUntil:
    visible:
      id: project-library
    timeout: 20000
- tapOn:
    id: tab-projects
- tapOn:
    id: project-mode-continuation
- tapOn:
    id: new-project-button
- tapOn:
    id: new-project-name
- inputText: 'E2E_CONTINUATION'
- tapOn: '原著续写'
- tapOn:
    id: create-project-button
- extendedWaitUntil:
    visible: 'E2E_CONTINUATION'
    timeout: 10000
- tapOn:
    id: tab-resources
- tapOn:
    id: resource-tab-continuation
- extendedWaitUntil:
    visible:
      id: continuation-import-txt
    timeout: 10000
- assertVisible: '导入 TXT 原著'
- assertVisible:
    id: continuation-import-txt
