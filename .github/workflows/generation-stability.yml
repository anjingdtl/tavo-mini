name: Generation Stability

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: generation-stability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generation-stability:
    name: Generation Stability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Writing contract, frozen context, replay, Golden and semantic Apply
        run: >-
          npm test -- --runInBand --runTestsByPath
          __tests__/writingSourceContract.test.ts
          __tests__/writingLegacyRestart.test.ts
          __tests__/writingKernelReconstruction.test.ts
          __tests__/writingTracePersistence.test.ts
          __tests__/pipelineTaskStore.test.ts
          __tests__/writingSemanticApply.test.ts
          __tests__/continuationV5Contracts.test.ts
          __tests__/goldenJourneys.test.ts
          __tests__/goldenJourneysMultiChapter.test.ts
          __tests__/replayHarness.test.ts
          __tests__/writingSharedStageSet.test.ts
          __tests__/writingRequirement.test.ts
          __tests__/writingPolicy.test.ts
          __tests__/writingFreezePersistence.test.ts
          __tests__/writingSingleWriterImplementation.test.ts
          __tests__/writingNoScenarioExecutor.test.ts
          __tests__/writingNoEmptyStage.test.ts
          __tests__/writingFinalSealGates.test.ts
          __tests__/writingFinalSealBehavior.test.ts
          __tests__/writingFirstPassContracts.test.ts
          __tests__/writingOneShotProfile.test.ts
          __tests__/writingOneShotPaidCallGate.test.ts
          __tests__/writingOneShotStagePolicy.test.ts
          __tests__/writingOneShotElasticBudget.test.ts
          __tests__/writingOneShotResume.test.ts
          __tests__/writingOneShotOnePaidCallPerChapter.test.ts
          __tests__/writingOneShotSkipLedgerSemantics.test.ts
          __tests__/writingChapterObservability.test.ts
          __tests__/writingOneFlowPhase0Baseline.test.ts
          __tests__/writingOneFlowPhase1Memory.test.ts
          __tests__/writingOneFlowPhase2Context.test.ts
          __tests__/writingOneFlowPhase3Pipeline.test.ts
          __tests__/writingOneFlowPhase4Flow.test.ts
          __tests__/writingOneFlowClosureOutbox.test.ts
          __tests__/writingOneFlowClosurePendingReplay.test.ts
          __tests__/writingOneFlowClosureReadyGate.test.ts

      - name: Phase 2 Final Seal generation stability gates
        run: >-
          npm test -- --runInBand --runTestsByPath
          __tests__/writingPhase2Baseline.test.ts
          __tests__/writingFinalCandidateContract.test.ts
          __tests__/outlineWorkflowVersion.test.ts
          __tests__/writingProofRemovalContract.test.ts
          __tests__/writingQaConsolidationContract.test.ts
          __tests__/outlineStageRuntimeRunQaDispatch.test.ts
          __tests__/writingQaDurablePreloadContract.test.ts
          __tests__/writingQaStructuredContractAdmission.test.ts
          __tests__/writingCompactSemanticApplyContract.test.ts
          __tests__/writingOneShotCompactQaSkip.test.ts
          __tests__/writingRevisionTriggerContract.test.ts
          __tests__/continuationCompactLedgerContract.test.ts
          __tests__/continuationPipelineDagContract.test.ts
          __tests__/continuationPipelinePostWritingClosure.test.ts
          __tests__/outlineFinalizePostWritingIntegration.test.ts
          __tests__/outlinePostWritingOutbox.test.ts
          __tests__/writingPipelinePostWritingClosure.test.ts
          __tests__/writingCompactFormatterPolicy.test.ts
          __tests__/writingStageBudgetBinding.test.ts
          __tests__/writingTokenLedger.test.ts
          __tests__/phaseTwoGenerationStabilityGate.test.ts
